services:
  app:
    build:
      context: .
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    restart: always
    environment:
      CLICOLOR_FORCE: ${CLICOLOR_FORCE:-0}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.data/attachments:/app/attachments
    networks:
      - default
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROJECT_NAME:-trxd}_default"
      - "traefik.http.routers.app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.priority=1"
      - "traefik.http.services.app.loadbalancer.server.port=1337"

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/data/pgdata
    volumes:
      - ./.data/pg_data:/var/lib/postgresql/18/data
    networks:
      - internal
      - default #! Debugging

  adminer:
    image: adminer:5
    restart: always
    ports:
      - "${ADMINER_PORT:-8000}:8080"
    networks:
      - internal
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.http.routers.adminer.rule=HostRegexp(`^adminer\\..+$`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.routers.adminer.priority=10"

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.data/redis_data:/data
    networks:
      - internal
      - default #! Debugging

  registry: # https://registry.localhost/v2/_catalog
    image: registry:3
    restart: always
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - ./registry/gc.sh:/gc.sh:ro
      - ./.data/registry_data:/var/lib/registry
    networks:
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"

      - "traefik.http.routers.registry.rule=HostRegexp(`^registry\\..+$`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls=true"
      - "traefik.http.routers.registry.priority=10"
      - "traefik.http.routers.registry.middlewares=registry-auth"

      - "traefik.http.middlewares.registry-auth.basicauth.users=${REGISTRY_USERNAME}:${REGISTRY_HTPASSWORD}"

      - "traefik.http.routers.registry-http.rule=HostRegexp(`^registry\\..+$`)"
      - "traefik.http.routers.registry-http.entrypoints=web"
      - "traefik.http.routers.registry-http.priority=10"
      - "traefik.http.routers.registry-http.middlewares=redirect-to-https"

      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"


  traefik:
    image: traefik:v3.6
    restart: always
    environment:
      - TRAEFIK_USERNAME=${TRAEFIK_USERNAME:?}
      - TRAEFIK_HTPASSWORD=${TRAEFIK_HTPASSWORD:?}
    ports:
      - "80:80"
      - "443:443"
      - "5443:5443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      default:
      trxd-shared-internal:
        ipv4_address: 172.137.0.2


networks:
  default:
  internal:
    internal: true
  trxd-shared-internal:
    external: true
