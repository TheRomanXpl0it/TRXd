name: sudo kurl https://spacewar
category: rev
description: |
  The year is 3000 AD. The Pax Romana extends to the stars, but peace has been shattered.
  Xenomorph invaders challenge the might of the New Roman Empire. A letter arrives from the Senate,
  sealed with the golden eagle of Rome. It reads:
  "Darius Caesar, the stars burn with conflict. The alien invaders are unlike anything we've faced before—ruthless,
  cunning, and relentless. They strike at our borders,
  threatening to unravel the Pax Galactica and reduce the New Roman Empire to ashes.
  Our legions are strong, but strength alone will not win this war. You must outthink,
  outmaneuver, and outlast them. The fate of humanity hangs by a thread, and only your brilliance can secure our future.
  Will you rise to the challenge and lead us to victory, or shall Rome fall to the void?"
authors:
  - kristoj
tags:
  - Easy
  - c++
  - sudoku

score_type: Dynamic # Static, Dynamic
max_points: 500

host: sudoku.chall.theromanxpl0.it
port: 1337 # port to connect to, if instance_type != Static or hash_domain == true: then this is the internal service port
conn_type: TCP # TCP, HTTP, HTTPS
hash_domain: true # whether to add a random prefix to the domain (e.g. 00112233.domain.com)

instance_type: Container # Static, Conatiner, Compose
image: registry.localhost/trxctf-sudoku # if instance_type is Container, this is the image to use
compose: ./remote/compose.yml # if instance_type is Compose, this is the compose file to use
lifetime: 900 # seconds
renewable: false # whether the instance can be renewed before it expires
envs: '{"key": "value"}' # environment variables to set in the container or compose context
max_memory: 512 # MB
max_cpus: 1.0

flags:
  - flag: TRX{H0w_0ft3n_d0_y0u_th1nk_4b0ut_th3_R0m4n_3mp1r3?!?:D}
    regex: false

attachments:
  - ./attachments/chall
  - ./attachments/Dockerfile
