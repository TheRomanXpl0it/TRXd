basePath: /
definitions:
  attachments_create.Data:
    properties:
      chall_id:
        type: integer
    required:
    - chall_id
    type: object
  attachments_delete.Data:
    properties:
      chall_id:
        type: integer
      names:
        items:
          type: string
        type: array
    required:
    - chall_id
    - names
    type: object
  categories_create.Data:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  categories_delete.Data:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  categories_update.Data:
    properties:
      name:
        type: string
      new_name:
        type: string
    required:
    - name
    - new_name
    type: object
  challenges_all_get.Chall:
    properties:
      attachments:
        items:
          type: string
        type: array
      authors:
        items:
          type: string
        type: array
      category:
        type: string
      conn_type:
        $ref: '#/definitions/sqlc.ConnType'
      description:
        type: string
      first_blood:
        type: boolean
      hidden:
        type: boolean
      host:
        type: string
      id:
        type: integer
      instance:
        type: boolean
      instance_hash_domain:
        type: boolean
      instance_host:
        type: string
      instance_port:
        type: integer
      instance_renewable:
        type: boolean
      max_points:
        type: integer
      name:
        type: string
      points:
        type: integer
      port:
        type: integer
      score_type:
        $ref: '#/definitions/sqlc.ScoreType'
      solved:
        type: boolean
      solves:
        type: integer
      tags:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  challenges_create.Data:
    properties:
      category:
        type: string
      description:
        type: string
      max_points:
        type: integer
      name:
        type: string
      score_type:
        $ref: '#/definitions/sqlc.ScoreType'
      type:
        $ref: '#/definitions/sqlc.DeployType'
    required:
    - category
    - max_points
    - name
    - score_type
    - type
    type: object
  challenges_delete.Data:
    properties:
      chall_id:
        type: integer
    required:
    - chall_id
    type: object
  challenges_get.Chall:
    properties:
      attachments:
        items:
          type: string
        type: array
      authors:
        items:
          type: string
        type: array
      category:
        type: string
      conn_type:
        $ref: '#/definitions/sqlc.ConnType'
      description:
        type: string
      docker_config:
        $ref: '#/definitions/challenges_get.DockerConfig'
      flags:
        items:
          $ref: '#/definitions/sqlc.GetFlagsByChallengeRow'
        type: array
      hidden:
        type: boolean
      host:
        type: string
      max_points:
        type: integer
      name:
        type: string
      port:
        type: integer
      score_type:
        $ref: '#/definitions/sqlc.ScoreType'
      solves_list:
        items:
          $ref: '#/definitions/sqlc.GetChallengeSolvesRow'
        type: array
      tags:
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/sqlc.DeployType'
    type: object
  challenges_get.DockerConfig:
    properties:
      compose:
        type: string
      envs:
        type: string
      hash_domain:
        type: boolean
      image:
        type: string
      lifetime:
        type: integer
      max_cpu:
        type: string
      max_memory:
        type: integer
      renewable:
        type: boolean
    type: object
  challenges_hidden.Data:
    properties:
      chall_ids:
        items:
          type: integer
        type: array
    required:
    - chall_ids
    type: object
  challenges_update.Data:
    properties:
      authors:
        items:
          type: string
        type: array
      category:
        type: string
      chall_id:
        type: integer
      compose:
        type: string
      conn_type:
        $ref: '#/definitions/sqlc.ConnType'
      description:
        type: string
      envs:
        type: string
      hash_domain:
        type: boolean
      hidden:
        type: boolean
      host:
        type: string
      image:
        type: string
      lifetime:
        type: integer
      max_cpu:
        type: string
      max_memory:
        type: integer
      max_points:
        type: integer
      name:
        type: string
      port:
        type: integer
      renewable:
        type: boolean
      score_type:
        $ref: '#/definitions/sqlc.ScoreType'
      tags:
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/sqlc.DeployType'
    required:
    - chall_id
    type: object
  configs_update.Data:
    properties:
      key:
        type: string
      value:
        type: string
    required:
    - key
    - value
    type: object
  flags_create.Data:
    properties:
      chall_id:
        type: integer
      flag:
        type: string
      regex:
        type: boolean
    required:
    - chall_id
    - flag
    type: object
  flags_delete.Data:
    properties:
      chall_id:
        type: integer
      flag:
        type: string
    required:
    - chall_id
    - flag
    type: object
  flags_update.Data:
    properties:
      chall_id:
        type: integer
      flag:
        type: string
      new_flag:
        type: string
      regex:
        type: boolean
    required:
    - chall_id
    - flag
    type: object
  instances_create.Data:
    properties:
      chall_id:
        type: integer
    required:
    - chall_id
    type: object
  instances_delete.Data:
    properties:
      chall_id:
        type: integer
      team_id:
        type: integer
    required:
    - chall_id
    type: object
  instances_update.Data:
    properties:
      chall_id:
        type: integer
    required:
    - chall_id
    type: object
  models.Error:
    properties:
      error:
        type: string
    type: object
  sqlc.Config:
    properties:
      category:
        type: string
      description:
        type: string
      key:
        type: string
      name:
        type: string
      secret:
        type: boolean
      type:
        type: string
      value:
        type: string
    type: object
  sqlc.ConnType:
    enum:
    - NONE
    - TCP
    - HTTP
    - HTTPS
    type: string
    x-enum-varnames:
    - ConnTypeNONE
    - ConnTypeTCP
    - ConnTypeHTTP
    - ConnTypeHTTPS
  sqlc.DeployType:
    enum:
    - Normal
    - Container
    - Compose
    type: string
    x-enum-varnames:
    - DeployTypeNormal
    - DeployTypeContainer
    - DeployTypeCompose
  sqlc.GetAdminStatsRow:
    properties:
      total_challenges:
        type: integer
      total_correct_submissions:
        type: integer
      total_players:
        type: integer
      total_released_challenges:
        type: integer
      total_submissions:
        type: integer
      total_teams:
        type: integer
      total_users:
        type: integer
    type: object
  sqlc.GetChallengeSolvesRow:
    properties:
      id:
        type: integer
      name:
        type: string
      timestamp:
        type: string
    type: object
  sqlc.GetFlagsByChallengeRow:
    properties:
      flag:
        type: string
      regex:
        type: boolean
    type: object
  sqlc.GetInstancesRow:
    properties:
      chall_id:
        type: integer
      chall_name:
        type: string
      conn_type:
        $ref: '#/definitions/sqlc.ConnType'
      docker_id:
        type: string
      expires_at:
        type: string
      host:
        type: string
      port:
        type: integer
      team_id:
        type: integer
      team_name:
        type: string
    type: object
  sqlc.ScoreType:
    enum:
    - Static
    - Dynamic
    type: string
    x-enum-varnames:
    - ScoreTypeStatic
    - ScoreTypeDynamic
  sqlc.SubmissionStatus:
    enum:
    - Wrong
    - Correct
    - Repeated
    - Invalid
    type: string
    x-enum-varnames:
    - SubmissionStatusWrong
    - SubmissionStatusCorrect
    - SubmissionStatusRepeated
    - SubmissionStatusInvalid
  submissions_create.Data:
    properties:
      chall_id:
        type: integer
      flag:
        type: string
    required:
    - chall_id
    - flag
    type: object
  submissions_create.Response:
    properties:
      first_blood:
        type: boolean
      status:
        $ref: '#/definitions/sqlc.SubmissionStatus'
    type: object
  submissions_delete.Data:
    properties:
      sub_id:
        type: integer
    required:
    - sub_id
    type: object
  submissions_get.Response:
    properties:
      submissions:
        items:
          $ref: '#/definitions/submissions_get.Submissions'
        type: array
      total:
        type: integer
    type: object
  submissions_get.Submissions:
    properties:
      chall_id:
        type: integer
      chall_name:
        type: string
      first_blood:
        type: boolean
      flag:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/sqlc.SubmissionStatus'
      team_id:
        type: integer
      team_name:
        type: string
      timestamp:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
info:
  contact: {}
  title: TRXd API
paths:
  /api/attachments:
    delete:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Deletes attachments for an existing challenge with the provided names.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/attachments_delete.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `ChallID must be at least 0` | `Names[i] must not exceed 128`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Attachment not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error fetching attachment` | `Error deleting
            attachment`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Deletes attachments for a challenge'
      tags:
      - attachments
    post:
      consumes:
      - multipart/form-data
      description: |-
        Requires **Author** privileges or higher.
        Creates new attachments for an existing challenge with the provided files.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/attachments_create.Data'
      - collectionFormat: csv
        description: the list of files to upload (at least one file is required)
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid multipart form` | `Invalid form
            data` | `Missing required fields` | `ChallID must be at least 0` | `Attachments[i]
            must not exceed 128`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Challenge not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: 'Possible errors: `Attachment already exists`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error fetching challenge` | `Error creating
            attachments`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Creates new attachments for a challenge'
      tags:
      - attachments
  /api/categories:
    delete:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Deletes an existing category with the provided name.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/categories_delete.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `Name must not exceed 32`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error deleting category`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Deletes a category'
      tags:
      - categories
    get:
      description: |-
        Requires **Player** privileges or higher (with role **Player** is also required to be in a team and the competition has to be active).
        Retrieves a list of all categories (with role **Player** only visible one are returned).
      produces:
      - application/json
      responses:
        "200":
          description: List of category names
          schema:
            items:
              type: string
            type: array
        "500":
          description: 'Possible errors: `Error fetching categories`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Player+] Gets all categories'
      tags:
      - categories
    patch:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Updates an existing category with the provided name (also updates its own challenges categories).
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/categories_update.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `Name must not exceed 32` | `NewName must not exceed 32`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Category not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: 'Possible errors: `Category already exists`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error fetching category` | `Error creating
            category` | `Error updating category` | `Error deleting category`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Updates a category'
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Creates a new category with the provided name.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/categories_create.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `Name must not exceed 32`'
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: 'Possible errors: `Category already exists`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error creating category`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Creates a new category'
      tags:
      - categories
  /api/challenges:
    delete:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Deletes a challenge with the provided ID.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/challenges_delete.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `ChallID must be at least 0`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error deleting challenge`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Deletes a challenge'
      tags:
      - challenges
    get:
      description: |-
        Requires **Player** privileges or higher (with role **Player** is also required to be in a team and the competition has to be active).
        Retrieves a list of all challenges (with role **Player** only visible one are returned).
      produces:
      - application/json
      responses:
        "200":
          description: List of challenges with all dysplayable details (except solves)
          schema:
            items:
              $ref: '#/definitions/challenges_all_get.Chall'
            type: array
        "500":
          description: 'Possible errors: `Error fetching challenges`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Player+] Gets all challenges'
      tags:
      - challenges
    patch:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Updates an existing challenge with the provided fields, only the `chall_id` is required.
      parameters:
      - description: '`chall_id` is required, the rest of the fields are optional,
          only provide the fields you want to update'
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/challenges_update.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `No data provided to update` | `ChallID must be at least 0`
            | `Name must not exceed 128` | `Category must not exceed 32` | `Description
            must not exceed 10240` | `Authors[i] must not exceed 64` | `Tags[i] must
            not exceed 32` | `Type must be one of: Normal Container Compose` | `MaxPoints
            must be at least 0` | `ScoreType must be one of: Static Dynamic` | `Port
            must be at least 0` | `Port must not exceed 65535` | `ConnType must be
            one of: NONE TCP HTTP HTTPS` | `Lifetime must be at least 0` | `Invalid
            environment variables` | `MaxMemory must be at least 0` | `Invalid Max
            CPU, must be a positive 32-bit integer`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Challenge not found` | `Category not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: 'Possible errors: `Challenge name already exists`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error fetching challenge` | `Error updating
            challenge`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Updates details of an existing challenge'
      tags:
      - challenges
    post:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Creates a new challenge with the provided details.
      parameters:
      - description: all fields are required except **description**
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/challenges_create.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `Name must not exceed 32` | `Category must not exceed 32` |
            `Description must not exceed 10240` | `Type must be one of: Normal Container
            Compose` | `MaxPoints must be at least 0` | `ScoreType must be one of:
            Static Dynamic`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Category not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "409":
          description: 'Possible errors: `Challenge already exists`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error creating challenge`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Creates a new challenge'
      tags:
      - challenges
  /api/challenges/:id:
    get:
      description: |-
        Requires **Player** privileges or higher (with role **Player** is also required to be in a team and the competition has to be active).
        Retrieves challenge details (with role **Player** only solves if the challenge is visible).
      parameters:
      - description: Challenge ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: solves is only included if the requester has Player role, otherwise
            all the challenge details are included except the solves
          schema:
            $ref: '#/definitions/challenges_get.Chall'
        "400":
          description: 'Possible errors: `Invalid challenge ID, must be non negative`
            | `id must be at least 0`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Challenge not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error fetching challenge`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Player+] Gets challenge details'
      tags:
      - challenges
  /api/challenges/hidden:
    patch:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Toggles the hidden status of the specified challenges.
      parameters:
      - description: a list of challenge IDs to toggle hidden status
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/challenges_hidden.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `ChallIDs[i] must be at least 0`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error updating challenge`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Author+] Toggles a list of challenges between hidden and visible'
      tags:
      - challenges
  /api/configs:
    get:
      description: |-
        Requires **Admin** privileges.
        Retrieves a list of all configs.
      produces:
      - application/json
      responses:
        "200":
          description: List of configs with all displayable details
          schema:
            items:
              $ref: '#/definitions/sqlc.Config'
            type: array
        "500":
          description: 'Possible errors: `Error fetching configurations`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Admin] Gets all configs'
      tags:
      - configs
    patch:
      consumes:
      - application/json
      description: |-
        Requires **Admin** privileges.
        Updates an existing config's value.
        Note: if `user-mode` is updated, the server will automatically shut down and restart to apply the change.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/configs_update.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Configuration not found`'
          schema:
            $ref: '#/definitions/models.Error'
        "500":
          description: 'Possible errors: `Error updating configuration`'
          schema:
            $ref: '#/definitions/models.Error'
      summary: '[Admin] Updates details of an existing config'
      tags:
      - configs
  /api/flags:
    delete:
      consumes:
      - application/json
      description: |-
        Requires **Author** privileges or higher.
        Deletes a flag of a challenge.
      parameters:
      - description: all fields are required
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/flags_delete.Data'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: 'Possible errors: `Invalid JSON format` | `Missing required
            fields` | `ChallID must be at least 0` | `Flag must not exceed 256`'
          schema:
            $ref: '#/definitions/models.Error'
        "404":
          description: 'Possible errors: `Challenge not found`'
          schema:
